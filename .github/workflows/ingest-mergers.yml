name: Ingest mergers

# Downloads NCUA Insurance Report of Activity ZIPs and writes merger + charter-
# conversion records to data/MERGERS/ and data/CONVERSIONS/. Run this for the same quarters you ingested call-report data for.
# Reports are quarterly from 2018-09 onward (month tokens march/june/sept/dec).
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: 'Space-separated quarters or years, e.g. "2025-12 2025-09" or "2024 2023"'
        required: true
        default: "2025-12"

# Prevent concurrent runs from racing the same push
concurrency:
  group: ingest-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas pyarrow requests openpyxl

      - name: Run merger ingest
        env:
          QUARTERS: ${{ inputs.quarters }}
        run: python ingest_mergers.py

      - name: Commit & push merger Parquet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/MERGERS data/CONVERSIONS
          if git diff --cached --quiet; then
            echo "No merger data changes to commit."
            exit 0
          fi
          git commit -m "Ingest mergers + conversions: ${{ inputs.quarters }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push attempt $i failed; retrying after rebase..."
            sleep 5
          done
