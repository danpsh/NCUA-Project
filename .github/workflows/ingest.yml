name: Build NCUA data

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to ingest -- YYYY-MM, month must be 03, 06, 09, or 12"
        required: true
        default: "2025-09"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the ingest needs
        run: pip install pandas pyarrow requests

      - name: Remove leftover raw NCUA .txt dumps (keeps requirements.txt)
        run: find . -maxdepth 1 -name '*.txt' ! -name 'requirements.txt' -delete

      - name: Run the ingest for the chosen quarter
        run: python ingest_ncua.py --quarter "${{ inputs.quarter }}"

      - name: Commit the generated data back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add NCUA data for ${{ inputs.quarter }}"
          git push
