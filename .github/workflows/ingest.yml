name: Build NCUA data

# Run from the Actions tab. In the "quarters" box you can enter:
#   a single quarter:      2025-12
#   several quarters:      2025-09 2025-12
#   whole years (expand):  2024 2023
#   a mix:                 2024 2025-12
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: "Quarters and/or years, space-separated. A bare year expands to all 4 quarters."
        required: true
        default: "2025-12"

permissions:
  contents: write

# Only one ingest run at a time, so two runs can't race to push to main.
concurrency:
  group: build-ncua-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the ingest needs
        run: pip install pandas pyarrow requests

      - name: Remove leftover raw NCUA .txt dumps (keeps requirements.txt)
        run: find . -maxdepth 1 -name '*.txt' ! -name 'requirements.txt' -delete

      - name: Run the ingest for the chosen quarters/years
        shell: bash
        env:
          QUARTERS: ${{ inputs.quarters }}
        run: |
          quarters=""
          for tok in $QUARTERS; do
            if [[ "$tok" =~ ^[0-9]{4}$ ]]; then
              for m in 03 06 09 12; do quarters="$quarters $tok-$m"; done
            else
              quarters="$quarters $tok"
            fi
          done
          args=""
          for q in $quarters; do args="$args --quarter $q"; done
          echo "Ingesting:$quarters"
          python ingest_ncua.py $args

      - name: Commit and push the generated data
        shell: bash
        env:
          QUARTERS: ${{ inputs.quarters }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add NCUA data: $QUARTERS"
          # Pull any concurrent changes, then push; retry a few times to be safe.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "Push failed after retries." >&2
          exit 1
